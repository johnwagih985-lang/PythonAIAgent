        const playArrivalSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                masterGain.connect(audioCtx.destination);

                const playNote = (freq, start, duration) => {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
                    osc.connect(masterGain);
                    osc.start(audioCtx.currentTime + start);
                    osc.stop(audioCtx.currentTime + start + duration);
                };

                // نغمة متصاعدة خفيفة (C5 -> E5 -> G5)
                playNote(523.25, 0, 0.1); 
                playNote(659.25, 0.1, 0.1);
                playNote(783.99, 0.2, 0.5);

const highlightPython = (code) => {
    if (!code) return "";

    const escapeHtml = (text) => {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, (m) => map[m]);
    };

    // Regex مدمج للتعامل مع النصوص، التعليقات، الكلمات المحجوزة، الأرقام، والدوال بالترتيب الصحيح
    const combinedRegex = new RegExp(
        '(' +
        // 1. النصوص (بما في ذلك النصوص متعددة الأسطر)
        '"{3}[\\s\\S]*?"{3}|\'{3}[\\s\\S]*?\'{3}|"(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\'' +
        '|' +
        // 2. التعليقات
        '#.*' +
        '|' +
        // 3. الكلمات المحجوزة
        '\\b(def|class|if|else|elif|for|while|return|import|from|as|try|except|finally|with|global|nonlocal|lambda|None|True|False|and|or|not|in|is|break|continue|pass|raise|async|await|del|assert|yield)\\b' +
        '|' +
        // 4. الأرقام
        '\\b\\d+\\b' +
        '|' +
        // 5. أسماء الدوال (كلمة تليها قوس)
        '\\b(\\w+)(?=\\()' +
        ')', 'g'
    );

    return escapeHtml(code).replace(combinedRegex, (match, group1, keyword, funcName) => {
        if (match.startsWith('"') || match.startsWith("'")) {
            return `<span class="string">${match}</span>`;
        } else if (match.startsWith('#')) {
            return `<span class="comment">${match}</span>`;
        } else if (keyword) {
            return `<span class="keyword">${match}</span>`;
        } else if (/^\d+$/.test(match)) {
            return `<span class="number">${match}</span>`;
        } else if (funcName) {
            return `<span class="function">${funcName}</span>`;
        }
        return match;
    });
};

    }
    if (selectedMessages.size === 0) return;
    
    // Convert Set to sorted array (descending) to delete from end first
    const indicesToDelete = Array.from(selectedMessages).sort((a, b) => b - a);
    
    // Remove from chatHistory
    indicesToDelete.forEach(index => {
        chatHistory.splice(index, 1);
    });
    
    // Remove from DOM
    indicesToDelete.forEach(index => {
        const messages = document.querySelectorAll('.chat_list .message');
        if (messages[index]) {
            messages[index].remove();
        }
    });
    
    // Reset selection and save
    selectedMessages.clear();
    saveChatHistory();
    updateDeleteButtonVisibility();
};

const generateAPIResponse = async (div) => {
    const textElement = div.querySelector('.text');
    const checkbox = div.querySelector('.delete_checkbox');
    
    try {
        const response = await fetch(getAPI_URL(), {
            method: 'POST',
            headers: {
                "content-type": "application/json",
                "Authorization": `Bearer ${getCurrentAPIKey()}`
            },
                body: JSON.stringify({
                    model: "claude-sonnet-4-6",
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        { role: "user", content: userMessage }
                    ],
                    temperature: 0.7
                })
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        let apiResponse = data?.choices[0]?.message?.content;
        if (!apiResponse) {
            throw new Error('استجابة فارغة من الخادم');
        }
        apiResponse = apiResponse.replace(/```python|```/g, '').trim();
        // إزالة التنسيق السميك التقليدي
        apiResponse = apiResponse.replace(/\*\*(.*?)\*\*/g,'$1');
        
        // Save bot response to history
        chatHistory.push({
            text: apiResponse,
            isOutgoing: false,
            timestamp: Date.now()
        });
        const botMessageIndex = chatHistory.length - 1;
        
        // Update checkbox with correct index
        if (checkbox) {
            checkbox.setAttribute('data-index', botMessageIndex);
            checkbox.onclick = () => toggleMessageSelection(botMessageIndex, checkbox);
        }
        
        saveChatHistory();
        
        // عرض الكود الملون مباشرة لضمان سلامة التنسيق
        textElement.innerHTML = highlightPython(apiResponse);
        window.scrollTo(0, chat_list.scrollHeight);
        console.log(apiResponse);
        
        // Rotate key after successful request
        rotateKey();

    } catch (error) {
        console.log(error);
        textElement.innerHTML = `<span style="color: var(--warning);">حدث خطأ: ${error.message}. يرجى المحاولة مرة أخرى.</span>`;
        rotateKey();
    }
    finally{
        div.classList.remove('loading');
    }
}

        // ============================================================================
        // Python Interpreter & Utility Logic
        // ============================================================================
        
        /**
         * Displays a toast notification.
         */
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            if (!toastContainer) return;

            const toast = document.createElement('div');
            toast.className = `toast-message ${type}`;
            
            let iconClass = 'fas fa-info-circle';
            if (type === 'success') iconClass = 'fas fa-check-circle';
            else if (type === 'error') iconClass = 'fas fa-times-circle';

            toast.innerHTML = `<i class="${iconClass}"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);

            setTimeout(() => toast.remove(), 4000);
        }

        let interruptBuffer = null;
        if (typeof SharedArrayBuffer !== "undefined") {
            interruptBuffer = new Int32Array(new SharedArrayBuffer(4));
        }

        async function getPyodide() {
            if (pyodideInstance) return pyodideInstance;
            if (isPyodideLoading) {
                while (isPyodideLoading) await new Promise(resolve => setTimeout(resolve, 100));
                return pyodideInstance;
            }
            isPyodideLoading = true;
            try {
                const py = await loadPyodide();
                if (interruptBuffer) py.setInterruptBuffer(interruptBuffer);
                
                await py.runPythonAsync(`
                    import sys
                    from js import window

                    class OutputCapture:
                        def __init__(self): self.buffer = ""
                        def write(self, text):
                            self.buffer += text
                            if '\\n' in self.buffer:
                                parts = self.buffer.split('\\n')
                                for part in parts[:-1]: window.appendToOutput(part + '\\n')
                                self.buffer = parts[-1]
                        def flush(self):
                            if self.buffer:
                                window.appendToOutput(self.buffer)
                                self.buffer = ""

                    sys.stdout = OutputCapture()
                    sys.stderr = OutputCapture()
                `);
                pyodideInstance = py;
            } catch (e) {
                console.error("Pyodide failed to load", e);
                appendToOutput("❌ فشل تحميل بيئة بايثون. يرجى التحقق من اتصالك بالإنترنت.", 'error');
            } finally {
                isPyodideLoading = false;
            }
            return pyodideInstance;
        }

        function openInterpreter() {
            document.getElementById('interpreter-modal').classList.add('active');
            if (!pyodideInstance && !isPyodideLoading) {
                const output = document.getElementById('output-content-modal');
                output.innerHTML = '<div style="color: #f59e0b;">⏳ جارٍ تحميل بيئة Python...</div>';
                getPyodide().then(py => {
                    if(py) output.innerHTML = '<div style="color: #64748b;">✅ بيئة Python جاهزة.</div>';
                });
            }
        }

        function closeInterpreter() {
            document.getElementById('interpreter-modal').classList.remove('active');
        }

        function runCodeFromChat(runBtn) {
            const codeText = runBtn.parentElement.querySelector('.text').innerText;
            const codeInput = document.getElementById('code-input-modal');
            if (codeInput) {
                codeInput.value = codeText;
                updateLineNumbers(codeInput, 'line-numbers-modal');
            }
            openInterpreter();
            setTimeout(() => runPythonCode('modal'), 200);
        }

        async function runPythonCode(suffix) {
            const outputId = 'output-content-' + suffix;
            const outputElement = document.getElementById(outputId);
            outputElement.innerHTML = ''; 

            const code = document.getElementById('code-input-' + suffix).value;
            if (!code.trim()) {
                appendToOutput('الرجاء إدخال كود أولاً', 'warning');
                return;
            }

            appendToOutput('⏳ جارٍ التنفيذ...', 'info');
            const py = await getPyodide();
            if (!py) {
                appendToOutput('❌ فشل تحميل المترجم.', 'error');
                return;
            }

            try {
                if (interruptBuffer) interruptBuffer[0] = 0;
                await py.runPythonAsync(code);
            } catch (err) {
                appendToOutput('❌ خطأ: ' + err.message, 'error');
            } finally {
                 py.globals.get('sys').stdout.flush();
                 py.globals.get('sys').stderr.flush();
            }
        }

        function appendToOutput(text, type = 'default') {
            const output = document.getElementById('output-content-modal');
            if (!output) return;

            const loadingMsg = output.querySelector('.info-msg');
            if(loadingMsg) loadingMsg.remove();

            const span = document.createElement('span');
            span.textContent = text;
            if (type === 'error') span.style.color = '#ff6b6b';
            else if (type === 'info') {
                span.style.color = '#64748b';
                span.className = 'info-msg';
            }
            else if (type === 'warning') span.style.color = '#f59e0b';
            
            output.appendChild(span);
            output.scrollTop = output.scrollHeight;
        }
        window.appendToOutput = appendToOutput;

        function clearOutput(suffix) {
            document.getElementById('output-content-' + suffix).innerHTML = '# مخرجات التنفيذ ستظهر هنا...';
            const codeInput = document.getElementById('code-input-' + suffix);
            if (codeInput) {
                codeInput.value = '';
                updateLineNumbers(codeInput, 'line-numbers-' + suffix);
            }
        }

        function copyInterpreterCode(suffix) {
            const codeInput = document.getElementById('code-input-' + suffix);
            if (codeInput && codeInput.value) {
                navigator.clipboard.writeText(codeInput.value).then(() => {
                    showToast('تم نسخ الكود بنجاح!', 'success');
                }).catch(err => {
                    showToast('فشل نسخ الكود!', 'error');
                    console.error('Copy failed', err);
                });
            } else {
                showToast('لا يوجد كود لنسخه!', 'warning');
            }
        }

        function updateLineNumbers(textarea, lineNumbersId) {
            const lines = textarea.value.split('\n').length;
            const lineNumbers = document.getElementById(lineNumbersId);
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
        }
